name: windows

on:
  push:
    branches: [main, feat/cross-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        shell: pwsh
        run: uv run --no-project --python 3.12 --with pytest --with keyring==25.6.0 pytest bin -q
      - name: Resolve npx.cmd and propagate exit code
        shell: pwsh
        run: |
          uv run --no-project --python 3.12 --script bin/qaily_launch.py run -- npx --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QAILY_CONTEXT7 = 'probe'
          uv run --no-project --python 3.12 --script bin/qaily_launch.py run --secret PROBE=context7 -- node -e "process.exit(process.env.PROBE === 'probe' ? 7 : 1)"
          if ($LASTEXITCODE -ne 7) { throw 'Launcher did not propagate exit code 7' }
  live-integration:
    # Requires an explicit regional runner and authorized test setup; intentionally disabled.
    if: ${{ false }}
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: Write-Output 'Live integration is not configured'
